# Tiny Tapeout project information
project:
  title:        "8-bit CPU"      # Project title
  author:       "Nouran Elbana"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An 8-bit processor featuring eight general-purpose registers, eight ALU operations, instruction decoding, program control, and LOAD/STORE data memory."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     41666667       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nouranelbana_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "alu.v"
    - "control_unit.v"
    - "cpu_8bit.v"
    - "data_memory.v"
    - "instruction_decoder.v"
    - "instruction_memory.v"
    - "program_counter.v"
    - "register_8bit.v"
    - "register_file.v"
    - "tt_um_nouranelbana_cpu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Unused"
  ui[1]: "Unused"
  ui[2]: "Unused"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "result_debug[0]"
  uo[1]: "result_debug[1]"
  uo[2]: "result_debug[2]"
  uo[3]: "result_debug[3]"
  uo[4]: "result_debug[4]"
  uo[5]: "result_debug[5]"
  uo[6]: "result_debug[6]"
  uo[7]: "result_debug[7]"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
